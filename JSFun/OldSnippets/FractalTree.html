<!-- ~*~ ~*~ ~*~ -->

<!-- ####### #######  END MAIN  ####### ######## -->
<!-- SCRIPTS -->
<script>
// JS STUFFS:  
var Canvas = document.getElementById("Canvas1");
var ctx = Canvas.getContext("2d");
var cy = Canvas.height, cx = Canvas.width;
  
var RadsIn = document.getElementById("RadsIn");
var RadsSpan = document.getElementById("RadsSpan");
var Rads = RadsIn.value / 1000000.0;
RadsSpan.innerHTML = RadsIn.value / 1000000.0;
RadsIn.oninput = function()
{
	INIT(); // Remove if that is giving you problems
  Rads = RadsIn.value / 1000000.0;
  RadsSpan.innerHTML = Rads  + ": Radians.";
}
  
/*CODING TRAIN FRACTAL TREE (BASIC):
https://github.com/CodingTrain/Nebula-AppleSoft-Basic/blob/main/tree/tree.a
*/

/*60 REM HIGH RESOLUTION GRAPHICS
70 HGR
80 HCOLOR = 3*/

// ####### 90 REM INITIAL VARIABLES:

var SHRINK = 0.67;
var A = 3.14159 * 0.5;
var L = 50;
var LEVEL = 0;
const MAXLEV = 10;
var X = Canvas.width * 0.5, Y = Canvas.height;
var DA = Rads;
var DX = 0, DY = 0;
var NX = 0, NY = 0;
  
function INIT()
{
  SHRINK = 0.67;
	A = 3.14159 * 0.5;
	L = 112;
	LEVEL = 0;
	X = Canvas.width * 0.5; Y = Canvas.height * 0.9;
	DA = Rads;
	DX = 0; DY = 0;
	NX = 0; NY = 0;
  ctx.fillStyle = 'rgb(63, 0, 31)';
  ctx.fillRect(0, 0, Canvas.height, Canvas.width);
  REM_CALCULATE_NEXT_POINT();
}

//160 REM ARRAY FOR STACK OF TREE POSITIONS
//170 DIM XS(MAXLEV) : DIM YS(MAXLEV)
var XS = new Array(MAXLEV);
var YS = new Array(MAXLEV);

//1000 REM DRAW A SINGLE BRANCH!
function REM_CALCULATE_NEXT_POINT()
{
    //1010 REM CALCULATE NEXT POINT
    DX = L * Math.cos(A);
    DY = L * Math.sin(A);
    NX = X + DX; NY = Y - DY;
    
    //1050 REM DRAW BRANCH
    //cout << "1060 HPLOT " << X << ", " << Y << " TO " << NX << ", " << NY << '\n';
    //ctx.lineWidth = 1+i;
    ctx.fillStyle = 'rgb(0, 0, 255)';
    ctx.beginPath();
    ctx.moveTo(X,Y);
    ctx.lineTo(NX,NY);
    ctx.stroke();
    //1070 REM SAVE POSITION
    XS[LEVEL] = X; YS[LEVEL] = Y;
    //1090 REM NEXT BRANCH
    X = NX; Y = NY;
    LEVEL = LEVEL + 1;
    A = A + DA;
    L = L * SHRINK;
    if (LEVEL < MAXLEV) { REM_CALCULATE_NEXT_POINT(); } // THEN GOSUB 1000
    //1150 REM AND ANOTHER BRANCH
    A = A - DA * 2;
    if (LEVEL < MAXLEV) { REM_CALCULATE_NEXT_POINT(); }
    //1180 REM POP BACK
    A = A + DA;
    L = L / SHRINK;
    LEVEL = LEVEL - 1;
    X = XS[LEVEL]; Y = YS[LEVEL];
    //1230 RETURN
}
</script>
